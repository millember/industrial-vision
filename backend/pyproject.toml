[project]
name = "industrial-vision-backend"
version = "0.1.0"
description = "Backend Industrial Vision"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13,<2",
    "fastapi>=0.115,<1.0",
    "httpx>=0.28.1,<1",
    "pillow>=12,<13",
    "psycopg[binary]>=3.2,<4",
    "pwdlib[argon2]>=0.3,<1",
    "python-multipart>=0.0.22,<1",
    "sqlalchemy>=2,<3",
    "uvicorn[standard]>=0.30,<1.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
